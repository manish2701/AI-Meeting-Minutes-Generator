<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — AI Meeting Minutes Generator</title>
    <link rel="stylesheet" href="./assets/css/styles.css">
    <style>
        .not-found {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 24px;
        }
        .not-found h1 { font-size: 72px; margin: 0; color: var(--primary); }
        .not-found p { color: var(--text-secondary); margin: 8px 0 24px; }
    </style>
</head>
<body>
    <main class="not-found">
        <h1>404</h1>
        <p>That page does not exist.</p>
        <a class="btn btn-primary" href="./">Back to Dashboard</a>
    </main>
</body>
</html>
